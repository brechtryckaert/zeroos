# ZeroOS: the LoRa cap has one radio, so meshtasticd and the MeshCore
# repeater exclude each other. Starting one stops the other. (The single
# After= ordering lives in the meshtasticd drop-in; one is all systemd needs,
# since stop jobs always run before start jobs. Two would form a cycle.)
[Unit]
Conflicts=meshtasticd.service

[Service]
ExecStartPre=+/usr/local/sbin/zos-lora-cap-init
# The web dashboard and Python runtime are the bulk of its memory; keep it
# from crowding out the shell on a 512 MB CM0.
MemoryHigh=160M
