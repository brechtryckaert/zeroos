# Build the flashable ZeroOS image on GitHub's arm64 runners (native, no
# emulation: about 30-40 minutes). Run it from the Actions tab, push a tag
# like v0.4.0, or push to the "release" branch: the last two also publish a
# GitHub release (for the branch, named after .github/release-version).
name: ZeroOS image

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base image URL (.img.xz)
        default: https://downloads.raspberrypi.com/raspios_lite_arm64_latest
      setup_args:
        description: Extra zeroos-setup.sh options, e.g. --region US --meshcore-preset us
        default: ""
  push:
    tags: ["v*"]
    branches: [release]

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0          # for git describe (the image version)

      - name: Check the release name is free
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG=$GITHUB_REF_NAME; else TAG=$(cat .github/release-version); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists: bump .github/release-version"
            exit 1
          fi

      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fdisk e2fsprogs xz-utils rsync curl unzip

      - name: Release name
        if: github.event_name == 'push'
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG=$GITHUB_REF_NAME; else TAG=$(cat .github/release-version); fi
          echo "ZOS_RELEASE=$TAG" >> "$GITHUB_ENV"

      - name: Build image
        env:
          BASE: ${{ github.event.inputs.base || 'https://downloads.raspberrypi.com/raspios_lite_arm64_latest' }}
          SETUP_ARGS: ${{ github.event.inputs.setup_args }}
        run: |
          # shellcheck disable=SC2086
          sudo ZOS_RELEASE="${ZOS_RELEASE:-}" ./tools/image/build-image.sh --base "$BASE" --out "$PWD/out" -- $SETUP_ARGS
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: zeroos-image
          path: |
            out/*.img.xz
            out/*.tar.xz
            out/*.sha256
            out/*.release
          compression-level: 0

      - name: Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG=$GITHUB_REF_NAME
          else
            TAG=$(cat .github/release-version)
          fi
          # The notes are the commits since the last release: they are what
          # Settings -> Software update shows as "What's new".
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          {
            if [ -n "$PREV" ]; then
              git log --no-merges --format='* %s' "$PREV..$GITHUB_SHA"
            else
              git log --no-merges --format='* %s' -20 "$GITHUB_SHA"
            fi
            # Settings shows the notes up to this line.
            echo
            echo "---"
            echo
            echo "Flash the .img.xz to a new card, or update a running CardputerZero from"
            echo "Settings -> Software update (zeroos-update-$TAG.tar.xz)."
            if [ -n "$PREV" ]; then
              echo
              echo "Full changelog: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
            fi
          } > notes.md
          cat notes.md
          gh release create "$TAG" out/*.img.xz out/zeroos-update-*.tar.xz out/*.sha256 \
            --target "$GITHUB_SHA" --notes-file notes.md --title "ZeroOS $TAG"
