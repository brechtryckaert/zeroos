# Build the flashable ZeroOS image on GitHub's arm64 runners (native, no
# emulation: about 30-40 minutes). Run it from the Actions tab, or push a
# tag like v0.4.0 to also attach the image to a GitHub release.
name: ZeroOS image

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base image URL (.img.xz)
        default: https://downloads.raspberrypi.com/raspios_lite_arm64_latest
      setup_args:
        description: Extra zeroos-setup.sh options, e.g. --region US --meshcore-preset us
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0          # for git describe (the image version)

      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fdisk e2fsprogs xz-utils rsync curl unzip

      - name: Build image
        env:
          BASE: ${{ github.event.inputs.base || 'https://downloads.raspberrypi.com/raspios_lite_arm64_latest' }}
          SETUP_ARGS: ${{ github.event.inputs.setup_args }}
        run: |
          # shellcheck disable=SC2086
          sudo ./tools/image/build-image.sh --base "$BASE" --out "$PWD/out" -- $SETUP_ARGS
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: zeroos-image
          path: |
            out/*.img.xz
            out/*.sha256
            out/*.release
          compression-level: 0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.img.xz out/*.sha256 --generate-notes --title "ZeroOS $GITHUB_REF_NAME"
